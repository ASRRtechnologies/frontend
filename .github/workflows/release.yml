name: Release

# Keeps one release PR open per package from the conventional commits on dev:
# `fix:` bumps the patch, `feat:` the minor, a breaking change the major (the
# minor while a package is on 0.x). Merging it tags `<component>-vX.Y.Z` and
# publishes that package to npm.
on:
  push:
    branches: [dev]
  workflow_dispatch:

concurrency:
  group: release
  cancel-in-progress: false

permissions:
  contents: write
  pull-requests: write
  id-token: write # npm provenance

jobs:
  release-please:
    name: Release PR
    runs-on: ubuntu-latest
    outputs:
      releases_created: ${{ steps.rp.outputs.releases_created }}
      paths_released: ${{ steps.rp.outputs.paths_released }}
    steps:
      - id: rp
        uses: googleapis/release-please-action@v5
        with:
          config-file: release-please-config.json
          manifest-file: .release-please-manifest.json

  publish:
    name: Publish to npm
    needs: release-please
    if: needs.release-please.outputs.releases_created == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.3
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org
      - run: bun install --frozen-lockfile
      - run: bun run build
      # `bun pm pack` turns `workspace:*` into the real version; npm then
      # publishes that tarball with provenance. utils goes first, since ui depends on it.
      - name: Publish released packages
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
          PATHS: ${{ needs.release-please.outputs.paths_released }}
        run: |
          for dir in packages/utils packages/ui; do
            if echo "$PATHS" | grep -q "\"$dir\""; then
              (cd "$dir" && rm -f *.tgz && bun pm pack && npm publish ./*.tgz --provenance --access public)
            fi
          done
